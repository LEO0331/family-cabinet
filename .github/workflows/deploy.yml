name: Build and deploy Family Cabinet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies, including Astro build tooling
        run: npm audit --audit-level=high

      - name: Check project
        run: npm run check

      - name: Test project
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify generated routes and public content
        run: npm run verify:build


      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  security:
    name: Secret scanning (current files and new commits)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Always inspect the full published source tree, including untracked additions
      # in the PR merge checkout. This does not reclassify old exposed secrets as safe.
      - name: Scan current files for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact --exit-code=1 /repo

      # Scan only commits introduced by this change relative to the PR base
      # or previous push. This prevents old, independently documented findings
      # from blocking unrelated changes without suppressing new disclosures.
      - name: Scan new commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparison commit for $EVENT_NAME; current files were still scanned."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::error::Cannot resolve commits for security scan."
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --log-opts="$BASE_SHA..$HEAD_SHA" --exit-code=1 /repo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [build, security]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
