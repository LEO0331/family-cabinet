name: Build and deploy Family Cabinet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies, including Astro build tooling
        run: npm audit --audit-level=high

      - name: Check project
        run: npm run check

      - name: Test project
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify generated routes and public content
        run: npm run verify:build


      - name: Upload static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  security:
    name: Secret scanning (full Git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/report" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --log-opts="--all" --exit-code=1 \
            --report-format=json --report-path=/report/findings.json /repo
          status=$?
          set -e

          # Print only rule IDs and source locations, never matched credential text.
          # Report files remain in ephemeral runner storage, not workflow artifacts.
          if [ -f "$RUNNER_TEMP/gitleaks/findings.json" ]; then
            node - "$RUNNER_TEMP/gitleaks/findings.json" <<'NODE'
          const fs = require('node:fs');
          const findings = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const finding of findings) {
            console.log(JSON.stringify({
              rule: finding.RuleID,
              file: finding.File,
              line: finding.StartLine,
              commit: finding.Commit,
            }));
          }
          NODE
          fi
          exit "$status"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [build, security]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
